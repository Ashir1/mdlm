[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-sudoku"
version = "0.1.0"
description = "Learned Relay Representations for diffusion MLM (Sudoku experiments)"
requires-python = ">=3.11"
dependencies = [
    "xlm-core",
    "torch",
    "jaxtyping",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["relay*"]

[tool.setuptools.package-data]
relay = ["configs/**/*.yaml"]
