# @package _global_
# Self-contained to avoid inheriting xlm-core's rotary_transformer (xlm.lm.ilm)
model:
  _target_: relay.model.RotaryTransformerModel
  num_embeddings: ${tokenizer:full_vocab_size}
  d_model: 384
  num_layers: 4
  nhead: 6
  padding_idx: ${tokenizer:pad_token_id}
  mask_idx: ${tokenizer:mask_token_id}
  dim_feedforward: ${eval:${.d_model}*4}
  dropout: 0.1
  activation: "relu"
  layer_norm_eps: 1.0e-05
  rotary_emb_dim: 64
  max_length: ${eval:${block_size}+${oc.select:input_block_size,0}+4}
  force_flash_attn: false
  final_layer_without_normalization: false

tags:
  model: rotary_transformer_xtiny
